name: zz lockgen (throwaway)
on:
  push:
    branches: ['verify/**']
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  gen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: |
          rm .github/workflows/zz-lockgen.yml
          gh actions-lock || true
          echo "=====DIFF====="
          git diff
          echo "=====LOCK====="
          cat .github/workflows/actions.lock
          echo "=====END====="
