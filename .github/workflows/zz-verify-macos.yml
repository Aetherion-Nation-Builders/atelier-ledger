# Throwaway: reproduces the release job's macOS build to read its error. Never merged.
name: Verify macOS build
on:
  push:
    branches: ["verify/**"]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build like the release
        shell: bash
        run: |
          set -o pipefail
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p gridcraft -p gridcraft-cli --target "$t" 2>&1 | tee -a build.log
          done
      - name: Report
        if: failure()
        shell: bash
        run: |
          sed 's/\x1b\[[0-9;]*[A-Za-z]//g' build.log > plain.log
          grep -n -E '^error' plain.log | cut -d: -f1 | head -12 | while read -r n; do
            msg=$(sed -n "${n},$((n+14))p" plain.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Error at line ${n}::${msg}"
          done
